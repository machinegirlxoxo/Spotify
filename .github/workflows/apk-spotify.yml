name: Build APK with Spotify
on:
  workflow_dispatch:
  push:
    paths:
      - 'spotify_login_full_ui (1).patch'
      - 'spotify-style-ui.patch'
      - '.github/workflows/apk-spotify.yml'

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply corrected Spotify patch
        run: git apply --3way --whitespace=nowarn --exclude="lib/ui/screens/Playlist/playlist_screen.dart" --exclude="lib/ui/screens/Search/search_screen.dart" "spotify_login_full_ui (1).patch"

      - name: Apply Spotify-style UI patch
        run: git apply --3way --whitespace=nowarn "spotify-style-ui.patch"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.x'
          channel: stable
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - run: flutter pub get

      - run: flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: spotify-harmony-apk
          path: build/app/outputs/flutter-apk/*.apk
