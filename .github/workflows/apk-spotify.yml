name: Build APK with Spotify
on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply login patch
        run: git apply --whitespace=nowarn "spotify_login_full_ui (1).patch"

      - name: Apply logout, speed and cover patch
        run: git apply --whitespace=nowarn spotify_logout_speed_cover.patch

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.x'
          channel: stable
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - run: flutter pub get

      - run: flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: spotify-harmony-apk
          path: build/app/outputs/flutter-apk/*.apk
